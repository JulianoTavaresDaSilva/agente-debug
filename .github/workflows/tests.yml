name: Testes do Agente Debug

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.15']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Verificar dependências
        run: python -m pip check
      - name: Executar testes sem API real
        run: python -m unittest discover -s tests -v
      - name: Demonstrar o executável sem credenciais
        run: python main.py --demo media
